services:
  backend:
    build: .
    ports:
      - "8080:8080" # HTTP
      - "8443:8443" # HTTPS
    volumes:
      - ./cooking_app.db:/app/cooking_app.db
      - ./logs:/app/logs
    environment:
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6378:6379"
    restart: unless-stopped
