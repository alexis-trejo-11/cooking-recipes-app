# Frontend CI-CD — build Angular, publish image to GHCR, deploy over Cloudflare SSH.
#
# Required repository Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST               — hostname reachable via Cloudflare Access (SSH)
#   SSH_USER               — SSH user on the deploy host
#   SSH_PRIVATE_KEY        — private key for that user
#   CF_CLIENT_ID           — Cloudflare Access service-token client id
#   CF_CLIENT_SECRET       — Cloudflare Access service-token client secret
#   GHCR_TOKEN             — token with read:packages (pull on deploy host)
#   FRONTEND_DEPLOY_PATH   — remote dir with compose / Makefile (make refresh)
#
# Optional Secrets:
#   GHCR_USER              — GHCR username (defaults to github.repository_owner)
#
# Notes:
#   - GITHUB_TOKEN is provided by Actions (push to GHCR); no need to create it.
#   - No repository Variables required for the image build.
#   - App runtime env (API_BASE_URL, ALLOWED_HOSTS, …) lives on the deploy
#     host .env — not in GitHub Actions. PORT is set in compose.
#     See frontend/.env.example.
#
# Image: ghcr.io/alexis-trejo-11/cooking-recipes-web
#
name: Frontend CI-CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"

permissions:
  contents: read
  packages: write
  actions: write

env:
  IMAGE_NAME: ghcr.io/alexis-trejo-11/cooking-recipes-web

jobs:
  # ---------------------------------------------------------------------------
  # Build Angular project (TypeScript / SSR compile check)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package-lock.json is gitignored in this repo, so npm ci cannot be used.
      - name: Install dependencies
        run: npm install

      - name: Build Angular project
        run: npm run build
        env:
          # Match production defaults; CI only needs a successful compile.
          NODE_ENV: production

  # ---------------------------------------------------------------------------
  # Login, build and push Docker image to ghcr.io
  # ---------------------------------------------------------------------------
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: meta
        run: |
          IMAGE="$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy — SSH via Cloudflare Access, pull image, refresh service
  # ---------------------------------------------------------------------------
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: frontend-deploy-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Configure SSH over Cloudflare Access
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Service Token auth must NOT go in ProxyCommand as --id/--secret:
          # cloudflared treats those as a listen address. Pass via CF_ACCESS_* env.
          {
            echo "Host deploy-host"
            echo "  HostName ${SSH_HOST}"
            echo "  User ${SSH_USER}"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  IdentitiesOnly yes"
            echo "  ProxyCommand cloudflared access ssh --hostname %h"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy via SSH (GHCR pull + restart)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          DEPLOY_PATH: ${{ secrets.FRONTEND_DEPLOY_PATH }}
          IMAGE: ${{ needs.publish.outputs.image }}
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "::error::FRONTEND_DEPLOY_PATH secret is required (remote directory with compose / Makefile)."
            exit 1
          fi

          GHCR_USER="${GHCR_USER:-${{ github.repository_owner }}}"

          ssh deploy-host \
            "export GHCR_TOKEN=$(printf '%q' "$GHCR_TOKEN") \
                    GHCR_USER=$(printf '%q' "$GHCR_USER") \
                    IMAGE=$(printf '%q' "$IMAGE") \
                    IMAGE_TAG=$(printf '%q' "$IMAGE_TAG") \
                    DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH"); bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          make refresh IMAGE="$IMAGE" IMAGE_TAG="$IMAGE_TAG"

          docker logout ghcr.io || true
          echo "Deploy finished."
          REMOTE
