services:
  backend:
    build: .
    image: ${IMAGE:-cooking-recipes-backend:latest}
    ports:
      - "8080:8080" # HTTP
      - "8443:8443" # HTTPS
    env_file:
      - .env
    environment:
      # Override host-oriented .env values when the API runs in-compose.
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./cooking_app.db:/app/cooking_app.db
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6378:6379"
    restart: unless-stopped
