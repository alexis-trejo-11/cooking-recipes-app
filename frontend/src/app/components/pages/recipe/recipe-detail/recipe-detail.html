<div class="recipe-detail-container">
  @if (loading()) {
  <div class="loading-container">
    <div class="image-skeleton"></div>
    <div class="content-skeleton"></div>
  </div>
  } @else if (recipe()) {
  <!-- Hero Section -->
  <app-recipe-hero [recipe]="recipe()!" />

  <!-- Main Content -->
  <div class="recipe-content">
    <div class="recipe-layout">
      <!-- Left Column -->
      <div class="recipe-main">
        <!-- Stats Card -->
        <app-recipe-stats [recipe]="recipe()!" (servingsChanged)="onServingsChanged($event)" />

        <!-- Ingredients Card -->
        <app-recipe-ingredients [recipe]="recipe()!" [scaledServings]="scaledServings()" />

        <!-- Instructions Card -->
        <app-recipe-instructions [recipe]="recipe()!" />
      </div>

      <!-- Right Column -->
      <div class="recipe-sidebar">
        <app-recipe-sidebar
          [recipe]="recipe()!"
          [isUserLoggedIn]="isUserLoggedIn"
          [isUserRecipeAuthor]="isUserRecipeAuthor"
          [isFavorite]="isFavorite()"
          (favoriteToggled)="onToggleFavorite()"
          (reviewOpened)="onOpenReview()"
          (editRequested)="onEditRecipe()"
          (deleteRequested)="onDeleteRecipe()"
        />
      </div>

      <!-- Review Modal -->
      @if (recipe()) {
      <app-review-modal
        [recipeId]="recipe()!.id"
        [isOpen]="showReviewModal()"
        (closed)="onReviewModalClosed()"
        (reviewSubmitted)="onReviewSubmitted($event)"
        (reviewDeleted)="onReviewDeleted($event)"
      />
      }
    </div>
  </div>
  } @else {
  <!-- Not Found State -->
  <div class="not-found-container">
    <h2 class="not-found-title">Recipe not found</h2>
    <p class="not-found-description">The recipe you're looking for doesn't exist.</p>
    <a routerLink="/recipes" class="browse-btn"> Browse Recipes </a>
  </div>
  }
</div>
