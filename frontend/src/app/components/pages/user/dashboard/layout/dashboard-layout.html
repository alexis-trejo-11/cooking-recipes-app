<div class="dashboard-layout">
  <div class="layout-container">
    <!-- Sidebar -->
    <aside
      class="sidebar"
      [class.sidebar-hidden]="!sidebarOpen()"
      [class.sidebar-visible]="sidebarOpen()"
    >
      <div class="sidebar-content">
        <div class="user-info">
          <div class="user-avatar">
            {{ authService.currentUser()?.fullName?.charAt(0)?.toUpperCase() }}
          </div>
          <div class="user-details">
            <h3 class="user-name">
              {{ authService.currentUser()?.fullName }}
            </h3>
            <p class="user-role">Dashboard</p>
          </div>
          <button (click)="toggleSidebar()" class="sidebar-toggle">
            <svg class="toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <nav class="sidebar-nav">
          <a routerLink="/dashboard/overview" routerLinkActive="nav-item-active" class="nav-item">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            <span>Overview</span>
          </a>

          <a routerLink="/dashboard/my-recipes" routerLinkActive="nav-item-active" class="nav-item">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
              />
            </svg>
            <span>My Recipes</span>
          </a>

          <a routerLink="/dashboard/create" routerLinkActive="nav-item-active" class="nav-item">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4"
              />
            </svg>
            <span>Create Recipe</span>
          </a>

          <a routerLink="/dashboard/favorites" routerLinkActive="nav-item-active" class="nav-item">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
              />
            </svg>
            <span>Favorites</span>
          </a>

          <a routerLink="/dashboard/profile" routerLinkActive="nav-item-active" class="nav-item">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <span>Profile</span>
          </a>

          <div class="nav-section">
            <a routerLink="/" class="nav-item">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10 19l-7-7m0 0l7-7m-7 7h18"
                />
              </svg>
              <span>Back to Home</span>
            </a>
          </div>
        </nav>
      </div>
    </aside>
    <!-- End of Sidebar -->

    <!-- Mobile Toggle Button - Solo visible cuando el sidebar está cerrado -->
    @if (!sidebarOpen()) {
    <div class="mobile-toggle-container">
      <button (click)="toggleSidebar()" class="mobile-toggle-button">
        <svg class="mobile-toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
    </div>
    }

    <div class="main-content">
      <main class="page-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>

  @if (sidebarOpen()) {
  <div class="sidebar-overlay" (click)="toggleSidebar()"></div>
  }
</div>
