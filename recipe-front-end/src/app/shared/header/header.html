<header class="header">
  <nav class="nav">
    <div class="nav-container">
      <div class="nav-left">
        <a routerLink="/" class="logo">
          <div class="logo-icon">
            <svg class="logo-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
              />
            </svg>
          </div>
          <span class="logo-text">RecipeBook</span>
        </a>

        <div class="nav-links">
          <a
            routerLink="/"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            Home
          </a>
          <a routerLink="/recipes" routerLinkActive="active-link" class="nav-link"> Recipes </a>
          @if (authService.isAuthenticated()) {
          <a routerLink="/favorites" routerLinkActive="active-link" class="nav-link"> Favorites </a>
          <a routerLink="/create" routerLinkActive="active-link" class="nav-link"> Create </a>
          }
          <a routerLink="/about" routerLinkActive="active-link" class="nav-link"> About </a>
        </div>
      </div>

      <div class="nav-right">
        <app-theme-toggle />

        @if (authService.isAuthenticated()) {
        <div class="user-section">
          <a routerLink="/profile" class="user-profile">
            <div class="user-avatar">
              {{ authService.currentUser()?.name?.charAt(0)?.toUpperCase() || 'U' }}
            </div>
            <span class="user-name">{{ authService.currentUser()?.name }}</span>
          </a>
          <button (click)="handleLogout()" class="logout-btn">Logout</button>
        </div>
        } @else {
        <div class="auth-section">
          <a routerLink="/login" class="login-link"> Login </a>
          <a routerLink="/signup" class="signup-btn"> Sign Up </a>
        </div>
        }

        <button class="mobile-menu-btn">
          <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
      </div>
    </div>
  </nav>
</header>
