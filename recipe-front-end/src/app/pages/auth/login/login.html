<div class="login-container">
  <div class="login-content">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-container">
          <svg class="logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
            />
          </svg>
        </div>
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to your RecipeBook account</p>
      </div>

      @if (error()) {
      <div class="error-message">
        <p class="error-text">{{ error() }}</p>
      </div>
      }

      <form (ngSubmit)="handleLogin()" #loginForm="ngForm">
        <div class="form-fields">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input
              type="email"
              [(ngModel)]="credentials.email"
              name="email"
              required
              email
              class="form-input"
              placeholder="your@email.com"
            />
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              type="password"
              [(ngModel)]="credentials.password"
              name="password"
              required
              class="form-input"
              placeholder="••••••••"
            />
          </div>
        </div>

        <button type="submit" [disabled]="!loginForm.valid || loading()" class="login-button">
          {{ loading() ? 'Signing in...' : 'Sign In' }}
        </button>

        <p class="signup-link">
          Don't have an account?
          <a routerLink="/signup" class="signup-text"> Sign Up </a>
        </p>
      </form>
    </div>
  </div>
</div>
